[project]
name = "atc-copilot"
version = "0.1.0"
description = "Transcribe ATC radio, parse clearances, and check them against ADS-B"
requires-python = ">=3.9"
dependencies = [
    # torch is installed separately so each machine gets the right CUDA/MPS build
    "transformers>=4.44,<4.50",
    "datasets>=2.20,<4",  # 4.x decodes audio with torchcodec, which is awkward on Windows
    "accelerate>=0.33",
    "jiwer>=3.0",
    "librosa>=0.10",
    "soundfile>=0.12",
]

[project.optional-dependencies]
train = ["tensorboard"]

[tool.setuptools]
packages = ["atc"]
